name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: zero runtime dependencies. The suite runs a mock Tripsy
      # (real PKCE, real Streamable HTTP MCP endpoint), so no account is needed.
      - name: Connect-flow end-to-end test
        run: node test/connect-e2e.mjs
